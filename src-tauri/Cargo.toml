[package]
name = "lynx-reader"
version = "0.1.0"
description = "LYNX Reader"
authors = ["lynxdarealest"]
edition = "2021"

[lib]
name = "lynx_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "gzip", "deflate"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net"] }
scraper = "0.22"
url = "2"
regex = "1"
base64 = "0.22"
encoding_rs = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
